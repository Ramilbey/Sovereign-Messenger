server {
    listen 80;
    server_name gov.local localhost 127.0.0.1;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gov.local localhost 127.0.0.1;

    ssl_certificate     /etc/nginx/certs/gov.local.crt;
    ssl_certificate_key /etc/nginx/certs/gov.local.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   HIGH:!aNULL:!MD5;

    # ── Element Web (frontend) ────────────────────────────────────────────────
    # Production: proxies to the matrix_element Docker container (nginx:alpine
    # serving the built webapp directory). Same pattern as /admin/ below.
    #
    # DEV MODE: to use webpack-dev-server with HMR instead, run ./dev.sh —
    # that script temporarily replaces this line with host.docker.internal:8080
    # and adds the WebSocket upgrade headers for hot-reload.
    location / {
        proxy_pass         http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── Matrix Client-Server API ──────────────────────────────────────────────
    location /_matrix {
        proxy_pass http://matrix_synapse:8008;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 50M;
    }

    # ── Synapse Admin API ─────────────────────────────────────────────────────
    location /_synapse {
        proxy_pass http://matrix_synapse:8008;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── synapse-admin UI ──────────────────────────────────────────────────────
    # Phase 1, §9: synapse-admin container evaluated and deployed.
    # Access: https://gov.local/admin/
    # Use a Synapse admin account token to log in (not the .env password).
    # ⚠️  Ensure this path is network-restricted in production
    #      (accessible only from the management VLAN / VPN).
    location /admin/ {
        proxy_pass         http://matrix_admin:80/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
